common_settings:
  hosts:
    run_list: 'pca-infra-common::pca-bootstrap'
    keys: ['/home/mintpress/.ssh/id_pca_opc_sshkey']
    use_flex: true
    cpu: 2
    memory: 16
    boot_volume_size_in_gbs: 75 
    native_instance_type: "VM.Standard3.Flex"
    operating_system: "Oracle Linux"
    operating_system_version: 9
    assign_public_ip: true
    configure_ocid_service: false
  storage:
    name: oracle
    size: 90
    mount_point: /oracle
  shared_storage:
    size: 50
    mount_point: /oracle/app/runtime
  domain_name: '.trial.limepoint.com'
  mount_target: 'mt-obp-tst-t1wpca'
  sec_test_subnet: &sec_test_subnet 'sn-a006b1-sec-tst'
  int_test_subnet: &int_test_subnet 'sn-a006b1-int-tst'
  app_test_subnet: &app_test_subnet 'sn-a006b1-app-tst'
  sec_test_network_security_groups: &sec_test_network_security_groups ["nsg-a006b1-tst-common-ops", "nsg-a006b1-tst-common-apps", "nsg-a006b1-tst-sec"]
  int_test_network_security_groups: &int_test_network_security_groups ["nsg-a006b1-tst-common-ops", "nsg-a006b1-tst-common-apps", "nsg-a006b1-tst-int"]
  app_test_network_security_groups: &app_test_network_security_groups ["nsg-a006b1-tst-common-ops", "nsg-a006b1-tst-common-apps", "nsg-a006b1-tst-app"]
assets:
  obpotd:
    subnet: sn-a006b1-slb-tst
    run_list: 'pca-infra-common::pca-bootstrap,pca-infra-common::otd-bootstrap'
    network_security_groups: ["nsg-a006b1-slb-tst-apps", "nsg-a006b1-tst-slb"]
    hosts:
      - name: cix1obpotd01
        operating_system: "Oracle Linux"
        operating_system_version: 8
        dns_entries: 
          - type: cname
            name: cix1obpotd01-pca
            values: cix1obpotd01
        # chef_node_name: cix1obpotd01-pca
        # cpu: 2
        memory: 18 # you can override the global configs
        # primary_ip: 10.107.159.44
        # boot_volume_size: 75 
        storage:
        - storage_name: cix1obpotd01-oracle
      - name: cix1obpotd02
        operating_system: "Oracle Linux"
        operating_system_version: 8
        dns_entries: 
          - type: cname
            name: cix1obpotd02-pca
            values: cix1obpotd02
        storage:
        - storage_name: cix1obpotd02-oracle
    shared_storage:
        - storage_name: cix1obpotd-runtime
          hosts:
            - name: cix1obpotd01
            - name: cix1obpotd02
          cluster_name: cix1obpotdcluster
  obpoam:
    subnet: *sec_test_subnet
