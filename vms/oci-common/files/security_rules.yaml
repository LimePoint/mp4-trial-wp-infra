# This file contains the default security rules that should be added to hosts in OCI
---
security_rules:

  all:
    -
      name:
        - 'targets-to-core-services'
        - 'from-external-to-bpd'
        - 'from-inside-to-internet'
        - 'from-external-to-tools'
  # These rules must be applied to all VMs/Environments.
  default:
    -
      name: 'targets-to-core-services'
  # These rules must be applied to all bpad environments and shared services (e.g. och, lisa)
  bpd_workload:
    -
      name:
        - 'targets-to-core-services'
        - 'from-external-to-bpd'

  # These rules must be only applied to mintpress and stage servers because this allows access to the internet.
  privileged_workload:
    -
      name:
        - 'targets-to-core-services'
        - 'from-inside-to-internet'

  # These rules must be only applied to core-services and mintpress services because these will allow access to port 22
  tools_workload:
    -
      name:
        - 'targets-to-core-services'
        - 'from-external-to-tools'
